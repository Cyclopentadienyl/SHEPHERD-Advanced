# Layered-architecture enforcement.
#
# ARCHITECTURE.md, module_dependencies.md and two source comments state that these rules are
# "enforced by import-linter" — this file is what makes that true. It was previously empty, so
# the claim held only by convention.
#
# Run:  make lint-imports        (or: uv run lint-imports)
#
# Rule: a lower layer must never import a higher one. Layers are listed HIGHEST FIRST, which is
# the order import-linter expects. (The snippet in module_dependencies.md listed them lowest-first
# and marked mutually-dependent packages as independent, which is why it never passed.)
#
# Separator meaning:
#   a | b   siblings that must NOT import each other
#   a : b   siblings that MAY import each other

[importlinter]
root_package = src

[importlinter:contract:layers]
name = Layered architecture (lower layers must not import higher ones)
type = layers
layers =
    src.api : src.webui
    src.evaluation
    src.inference
    src.training
    src.reasoning | src.llm
    src.models | src.retrieval
    src.kg | src.nlp | src.medical_standards
    src.ontology | src.data_sources
    src.utils
    src.config
    src.core

[importlinter:contract:webui-training]
name = WebUI must not import the training stack directly (use subprocess/API)
type = forbidden
source_modules =
    src.webui
forbidden_modules =
    src.training

# The vector-index subsystem was detached from diagnosis by institutional decision
# (see docs/RETRIEVAL_AND_CANDIDATE_DISCOVERY_FINDINGS.md). src.retrieval is kept,
# implemented and tested, for planned natural-language / vector-mapping work — but
# nothing on the diagnosis path may depend on it again without that being a
# deliberate, reviewed change.
#
# A layers contract cannot express this: layers only forbid a lower layer importing
# a higher one, and src.inference already sits ABOVE src.models | src.retrieval, so
# inference -> retrieval is permitted by the layer ordering.
#
# src.api.main is deliberately absent. It is the composition root and may
# legitimately construct a future NLP/vector-mapping service. Diagnosis is protected
# by the inference and route entries here plus the schema invariants in
# tests/unit/test_vector_index_detachment.py.
#
# src.webui is included for the same reason it may not import src.training: UI
# components go through the API/service boundary. A future natural-language input
# component does the same, so this does not block the planned upgrade.
[importlinter:contract:diagnosis-retrieval-detachment]
name = Diagnosis must not depend on the retrieval subsystem (detached by decision)
type = forbidden
source_modules =
    src.inference
    src.api.routes.diagnose
    src.webui
forbidden_modules =
    src.retrieval
