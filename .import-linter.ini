# Layered-architecture enforcement.
#
# ARCHITECTURE.md, module_dependencies.md and two source comments state that these rules are
# "enforced by import-linter" — this file is what makes that true. It was previously empty, so
# the claim held only by convention.
#
# Run:  make lint-imports        (or: uv run lint-imports)
#
# Rule: a lower layer must never import a higher one. Layers are listed HIGHEST FIRST, which is
# the order import-linter expects. (The snippet in module_dependencies.md listed them lowest-first
# and marked mutually-dependent packages as independent, which is why it never passed.)
#
# Separator meaning:
#   a | b   siblings that must NOT import each other
#   a : b   siblings that MAY import each other

[importlinter]
root_package = src

[importlinter:contract:layers]
name = Layered architecture (lower layers must not import higher ones)
type = layers
layers =
    src.api : src.webui
    src.evaluation
    src.inference
    src.training
    src.reasoning | src.llm
    src.models | src.retrieval
    src.kg | src.nlp | src.medical_standards
    src.ontology | src.data_sources
    src.utils
    src.config
    src.core

[importlinter:contract:webui-training]
name = WebUI must not import the training stack directly (use subprocess/API)
type = forbidden
source_modules =
    src.webui
forbidden_modules =
    src.training

# The vector-index subsystem was detached from diagnosis by institutional decision
# (see docs/RETRIEVAL_AND_CANDIDATE_DISCOVERY_FINDINGS.md). src.retrieval is kept,
# implemented and tested, for planned natural-language / vector-mapping work — but
# nothing on the diagnosis path may depend on it again without that being a
# deliberate, reviewed change.
#
# A layers contract cannot express this: layers only forbid a lower layer importing
# a higher one, and src.inference already sits ABOVE src.models | src.retrieval, so
# inference -> retrieval is permitted by the layer ordering.
#
# src.api.main is deliberately absent. It is the composition root and may
# legitimately construct a future NLP/vector-mapping service. Diagnosis is protected
# by the inference and route entries here plus the schema invariants in
# tests/unit/test_vector_index_detachment.py.
#
# src.webui is included for the same reason it may not import src.training: UI
# components go through the API/service boundary. A future natural-language input
# component does the same, so this does not block the planned upgrade.
[importlinter:contract:diagnosis-retrieval-detachment]
name = Diagnosis must not depend on the retrieval subsystem (detached by decision)
type = forbidden
source_modules =
    src.inference
    src.api.routes.diagnose
    src.webui
forbidden_modules =
    src.retrieval

# The Trainer's validation values are checked against an independent computation:
# `tests/unit/test_trainer_validation_values.py` drives `Trainer._run_evaluation_pass`
# and computes the expected top-20 rows, truths and MRR with the served primitives
# `masked_mean_pool` and `cosine_score_matrix` (`src.inference.scoring`). That check
# means something only while those primitives are written independently of the
# Trainer. The layers contract above enforces one half — `src.training` sits below
# `src.inference` and cannot import it — but layers are directional and permit the
# reverse. Verified empirically: with a probe `from src.training.trainer import
# Trainer` added to `src/inference/scoring.py`, all three contracts above still
# reported KEPT.
#
# So `src.inference.scoring` could later delegate to a training helper, the expected
# values would silently come from the code under test, and nothing would go red.
# This contract closes that direction.
#
# Narrow on purpose. It names `src.inference.scoring` — the module the Trainer value
# test and Mode C take `masked_mean_pool` and `cosine_score_matrix` from — and not
# the whole of `src.inference`, because forbidding the package outright is a wider
# architectural statement than that independence needs.
[importlinter:contract:scorer-independence]
name = The served scorer must not import the training stack (keeps the Trainer value test independent)
type = forbidden
source_modules =
    src.inference.scoring
forbidden_modules =
    src.training

# D4 (PLAN_TEST_RESULTS.md; §4.9 question 1): automatic checkpoint selection
# never reads test results. Selection lives in `src.utils.checkpoint_paths`
# (`select_auto_run_checkpoint`, `select_run_checkpoint`), whose only score is the
# checkpoint's own validation metric, and the reload route
# (`src.api.routes.pipeline`) is where it is called with that score. The layers
# contract already keeps src.utils below src.evaluation; it says nothing about
# the route, which sits above it. This contract names both, against the modules
# that hold test results: the ledger, the registration, the report store and
# D4's ordering.
#
# Direct imports only (`allow_indirect_imports`): the route may import a shared
# service that lists checkpoints with their recorded results for display, and
# that is not selection. What selection itself reads is pinned by behaviour in
# tests/unit/test_test_score_ordering.py (a ledger beside the checkpoints does not
# change what automatic selection chooses).
[importlinter:contract:selection-ignores-test-results]
name = Automatic checkpoint selection must not read test results (D4)
type = forbidden
source_modules =
    src.utils.checkpoint_paths
    src.api.routes.pipeline
forbidden_modules =
    src.evaluation.sidecar
    src.evaluation.registration
    src.evaluation.report_store
    src.evaluation.ordering
allow_indirect_imports = True
