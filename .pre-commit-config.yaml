# Optional local pre-commit hooks. `pre-commit` is declared in the dev extra, but this
# config was previously empty — installing the hooks silently checked nothing.
#
# Enable with:  uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
#
# Linters mirror pyproject.toml ([tool.ruff], [tool.black]) so local hooks and
# `make lint` / `make format` cannot disagree.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
