<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>SHEPHERD-Advanced</title>
  <!-- The desktop entry's icon (launch_shepherd.sh --install-desktop-entry): a
       shepherd's crook over a node graph, in the dashboard's blue. -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#1f4e8c"/>
  <g stroke="#cfe0f7" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="18" y1="44" x2="32" y2="50"/>
    <line x1="32" y1="50" x2="46" y2="42"/>
    <line x1="18" y1="44" x2="26" y2="32"/>
  </g>
  <g fill="#cfe0f7">
    <circle cx="18" cy="44" r="4"/>
    <circle cx="32" cy="50" r="4"/>
    <circle cx="46" cy="42" r="4"/>
    <circle cx="26" cy="32" r="4"/>
  </g>
  <path d="M40 54 V22 a8 8 0 1 0 -16 0" stroke="#ffffff" stroke-width="5" fill="none"
        stroke-linecap="round"/>
</svg>
